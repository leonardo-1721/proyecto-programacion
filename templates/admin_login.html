{% extends 'base.html' %}

{% block title %}Acceso Administrativo · Huellitas del Valle{% endblock %}

{% block content %}
<div class="container py-5 my-md-4">
    <div class="row justify-content-center">
        <div class="col-12 col-sm-10 col-md-7 col-lg-5">
            <div class="card border-0 rounded-4 shadow-sm bg-white p-4 p-md-5">
                <div class="text-center mb-4">
                    <div class="d-inline-flex align-items-center justify-content-center rounded-circle mb-3"
                         style="width: 64px; height: 64px; background-color: var(--mint-badge-bg); color: var(--mint-badge-text);">
                        <i class="bi bi-shield-lock-fill fs-2"></i>
                    </div>
                    <h1 class="h3 fw-bold text-dark mb-1">Acceso Administrativo</h1>
                    <p class="text-muted small mb-0">Ingresa tus credenciales para gestionar el refugio.</p>
                </div>

                {% if error %}
                <div class="alert alert-danger" role="alert">{{ error }}</div>
                {% endif %}

                <form method="post" action="{% url 'login_admin' %}">
                    {% csrf_token %}
                    <input type="hidden" name="next" value="{{ next_url }}">
                    <div class="mb-3">
                        <label for="username" class="form-label">Usuario administrador</label>
                        <input type="text" class="form-control" id="username" name="username"
                               value="{{ username_intentado }}" autocomplete="username" required autofocus>
                    </div>
                    <div class="mb-4">
                        <label for="password" class="form-label">Contraseña</label>
                        <input type="password" class="form-control" id="password" name="password"
                               autocomplete="current-password" required>
                    </div>
                    <button type="submit" class="btn btn-mockup-dark w-100 py-2 rounded-pill fw-semibold">
                        <i class="bi bi-box-arrow-in-right me-1"></i> Iniciar sesión
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
